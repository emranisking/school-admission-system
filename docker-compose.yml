services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-school_admission}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-school_admission}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host by default (only the backend needs it).
    # Uncomment to inspect the DB from your LAN / a GUI client:
    # ports:
    #   - "${DB_BIND:-0.0.0.0}:${DB_PORT:-5432}:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-school_admission};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-change_me};Maximum Pool Size=60
      Jwt__Key: ${JWT_KEY:-dev-only-change-me-please-use-a-long-random-secret-key-32+}
      Jwt__Issuer: ${JWT_ISSUER:-school-admission}
      Jwt__Audience: ${JWT_AUDIENCE:-school-admission-admin}
      Admin__Username: ${ADMIN_USERNAME:-admin}
      Admin__Password: ${ADMIN_PASSWORD:-Admin@12345}
      Admission__FeeAmount: ${ADMISSION_FEE:-5000}
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      Worker__Enabled: ${WORKER_ENABLED:-true}
      Worker__IntervalSeconds: ${WORKER_INTERVAL_SECONDS:-5}
      Seed__DemoData: ${SEED_DEMO_DATA:-false}
    expose:
      - "8080"                       # reachable from nginx as http://backend:8080
    ports:
      # Optional direct API access from LAN. Remove if you only use the frontend.
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-80}:80"

volumes:
  pgdata: