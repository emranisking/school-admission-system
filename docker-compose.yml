# School Admission Management System
#   docker compose up --build            -> frontend :5173, backend :8080, PostgreSQL :5432
#   docker compose --profile multi up -d -> additionally starts a SECOND backend instance on :8081
#                                           (same database) to demonstrate multi-instance safety.

x-backend-env: &backend-env
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
  ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-school_admission};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-change_me};Maximum Pool Size=${DB_POOL_SIZE:-60}"
  HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
  Jwt__Key: ${JWT_KEY:-change-this-development-jwt-signing-key-at-least-32-chars}
  Admin__Username: ${ADMIN_USERNAME:-admin}
  Admin__Password: ${ADMIN_PASSWORD:-Admin@12345}
  Admission__FeeAmount: ${ADMISSION_FEE:-5000}
  Worker__IntervalSeconds: ${EXPIRATION_INTERVAL_SECONDS:-5}
  Seed__DemoData: ${SEED_DEMO_DATA:-true}

services:
  postgres:
    image: postgres:16-alpine
    container_name: school-admission-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-school_admission}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-school_admission}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    image: school-admission-backend:latest
    container_name: school-admission-backend
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  backend2:
    image: school-admission-backend:latest
    container_name: school-admission-backend2
    restart: unless-stopped
    profiles: ["multi"]
    environment:
      <<: *backend-env
      Seed__DemoData: "false"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    ports:
      - "8081:8080"

  frontend:
    build:
      context: ./frontend
    container_name: school-admission-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
